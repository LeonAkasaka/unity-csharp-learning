<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" width="580" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#555"/></marker>
  </defs>

  <!-- スタック -->
  <rect x="20" y="30" width="320" height="160" rx="4" fill="#f5f5f5" stroke="#bbb"/>
  <text x="180" y="22" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">スタック</text>

  <rect x="32" y="42" width="296" height="136" rx="4" fill="#fff" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="42" y="60" font-size="12" fill="#1565c0">SumTop3Stack のスタックフレーム</text>

  <text x="92" y="92" font-size="14" fill="#333" text-anchor="end">values</text>
  <rect x="100" y="74" width="44" height="28" rx="3" fill="#f5f5f5" stroke="#bbb"/>
  <circle cx="122" cy="88" r="4" fill="#e65100"/>

  <text x="92" y="130" font-size="14" fill="#333" text-anchor="end">work</text>
  <rect x="100" y="112" width="44" height="28" rx="3" fill="#f5f5f5" stroke="#bbb"/>
  <circle cx="122" cy="126" r="4" fill="#e65100"/>
  <rect x="144" y="112" width="84" height="28" rx="3" fill="#f5f5f5" stroke="#bbb"/>
  <text x="186" y="131" font-size="12" fill="#333" text-anchor="middle">Length = 5</text>

  <!-- stackalloc の領域 -->
  <rect x="100" y="150" width="24" height="22" fill="#fff3e0" stroke="#e65100"/>
  <rect x="124" y="150" width="24" height="22" fill="#fff3e0" stroke="#e65100"/>
  <rect x="148" y="150" width="24" height="22" fill="#fff3e0" stroke="#e65100"/>
  <rect x="172" y="150" width="24" height="22" fill="#fff3e0" stroke="#e65100"/>
  <rect x="196" y="150" width="24" height="22" fill="#fff3e0" stroke="#e65100"/>
  <text x="226" y="166" font-size="11" fill="#e65100">stackalloc の領域</text>
  <path d="M 118 128 Q 80 145 98 158" fill="none" stroke="#e65100" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ヒープ -->
  <rect x="400" y="30" width="160" height="160" rx="4" fill="#f5f5f5" stroke="#bbb"/>
  <text x="480" y="22" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">ヒープ</text>
  <rect x="415" y="70" width="130" height="40" rx="4" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="480" y="95" font-size="12" fill="#555" text-anchor="middle">配列 scores</text>

  <line x1="126" y1="88" x2="411" y2="88" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="20" y="210" font-size="11" fill="#999">メソッドから戻ると、stackalloc の領域はスタックフレームごと取り除かれる</text>
</svg>
