<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#555"/></marker>
  </defs>

  <!-- 値型 -->
  <text x="20" y="24" font-size="14" font-weight="bold" fill="#333">値型（int）</text>
  <text x="20" y="44" font-size="12" fill="#555">変数に値そのものが入る</text>

  <text x="40" y="92" font-size="14" fill="#333" text-anchor="end">a</text>
  <rect x="50" y="70" width="70" height="34" rx="3" fill="#f5f5f5" stroke="#bbb"/>
  <text x="85" y="93" font-size="16" fill="#1565c0" text-anchor="middle">10</text>

  <text x="40" y="152" font-size="14" fill="#333" text-anchor="end">b</text>
  <rect x="50" y="130" width="70" height="34" rx="3" fill="#f5f5f5" stroke="#bbb"/>
  <text x="85" y="153" font-size="16" fill="#1565c0" text-anchor="middle">20</text>

  <text x="140" y="120" font-size="11" fill="#999">別々の値</text>

  <line x1="230" y1="15" x2="230" y2="185" stroke="#bbb" stroke-dasharray="4 4"/>

  <!-- 参照型 -->
  <text x="260" y="24" font-size="14" font-weight="bold" fill="#333">参照型（Box クラス）</text>
  <text x="260" y="44" font-size="12" fill="#555">変数にはオブジェクトへの参照が入る</text>

  <text x="280" y="92" font-size="14" fill="#333" text-anchor="end">p</text>
  <rect x="290" y="70" width="50" height="34" rx="3" fill="#f5f5f5" stroke="#bbb"/>
  <circle cx="315" cy="87" r="4" fill="#e65100"/>

  <text x="280" y="152" font-size="14" fill="#333" text-anchor="end">q</text>
  <rect x="290" y="130" width="50" height="34" rx="3" fill="#f5f5f5" stroke="#bbb"/>
  <circle cx="315" cy="147" r="4" fill="#e65100"/>

  <line x1="319" y1="87" x2="418" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="319" y1="147" x2="418" y2="126" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="422" y="88" width="120" height="58" rx="4" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="482" y="108" font-size="12" fill="#555" text-anchor="middle">Box オブジェクト</text>
  <text x="482" y="132" font-size="15" fill="#1565c0" text-anchor="middle">Value = 20</text>

  <text x="422" y="172" font-size="11" fill="#999">オブジェクトは 1 つだけ</text>
</svg>
