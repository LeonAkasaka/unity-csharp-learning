  <text x="70" y="82" font-size="14" fill="#333" text-anchor="end">n</text>
  <rect x="80" y="60" width="90" height="34" rx="3" fill="#fff" stroke="#bbb"/>
  <text x="125" y="83" font-size="16" fill="#1565c0" text-anchor="middle">10</text>

  <text x="70" y="137" font-size="14" fill="#333" text-anchor="end">box</text>
