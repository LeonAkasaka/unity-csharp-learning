<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#555"/></marker>
  </defs>

  <!-- 配列 -->
  <text x="20" y="24" font-size="14" font-weight="bold" fill="#333">配列 numbers</text>
  <rect x="20" y="36" width="60" height="38" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5"/>
  <text x="50" y="60" font-size="15" fill="#555" text-anchor="middle">10</text>
  <text x="50" y="90" font-size="10" fill="#999" text-anchor="middle">[0]</text>
  <rect x="80" y="36" width="60" height="38" rx="3" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="110" y="60" font-size="15" fill="#1565c0" text-anchor="middle">0</text>
  <text x="110" y="90" font-size="10" fill="#999" text-anchor="middle">[1]</text>
  <rect x="140" y="36" width="60" height="38" rx="3" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="170" y="60" font-size="15" fill="#1565c0" text-anchor="middle">30</text>
  <text x="170" y="90" font-size="10" fill="#999" text-anchor="middle">[2]</text>
  <rect x="200" y="36" width="60" height="38" rx="3" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="230" y="60" font-size="15" fill="#1565c0" text-anchor="middle">40</text>
  <text x="230" y="90" font-size="10" fill="#999" text-anchor="middle">[3]</text>
  <rect x="260" y="36" width="60" height="38" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5"/>
  <text x="290" y="60" font-size="15" fill="#555" text-anchor="middle">50</text>
  <text x="290" y="90" font-size="10" fill="#999" text-anchor="middle">[4]</text>

  <!-- Span の範囲 -->
  <path d="M 82 100 L 82 108 L 258 108 L 258 100" fill="none" stroke="#1565c0" stroke-width="1.5"/>
  <text x="266" y="112" font-size="11" fill="#1565c0">span が表す範囲</text>

  <!-- Span -->
  <text x="20" y="160" font-size="14" fill="#333">span</text>
  <rect x="60" y="140" width="60" height="34" rx="3" fill="#f5f5f5" stroke="#bbb"/>
  <circle cx="90" cy="157" r="4" fill="#e65100"/>
  <rect x="120" y="140" width="90" height="34" rx="3" fill="#f5f5f5" stroke="#bbb"/>
  <text x="165" y="162" font-size="13" fill="#333" text-anchor="middle">Length = 3</text>
  <path d="M 90 153 Q 70 110 96 80" fill="none" stroke="#e65100" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="60" y="192" font-size="11" fill="#999">先頭の要素への参照と長さだけを持つ（要素はコピーしない）</text>
</svg>
