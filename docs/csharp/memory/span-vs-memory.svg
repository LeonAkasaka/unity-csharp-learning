<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#555"/></marker>
  </defs>

  <!-- 配列 -->
  <text x="300" y="24" font-size="14" font-weight="bold" fill="#333">配列オブジェクト（ヒープ）</text>
  <rect x="300" y="36" width="44" height="100" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5"/>
  <text x="322" y="80" font-size="10" fill="#999" text-anchor="middle">型など</text>
  <text x="322" y="94" font-size="10" fill="#999" text-anchor="middle">の情報</text>
  <rect x="344" y="36" width="40" height="100" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5"/>
  <text x="364" y="91" font-size="14" fill="#555" text-anchor="middle">10</text>
  <text x="364" y="152" font-size="10" fill="#999" text-anchor="middle">[0]</text>
  <rect x="384" y="36" width="40" height="100" rx="3" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="404" y="91" font-size="14" fill="#1565c0" text-anchor="middle">20</text>
  <text x="404" y="152" font-size="10" fill="#999" text-anchor="middle">[1]</text>
  <rect x="424" y="36" width="40" height="100" rx="3" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="444" y="91" font-size="14" fill="#1565c0" text-anchor="middle">30</text>
  <text x="444" y="152" font-size="10" fill="#999" text-anchor="middle">[2]</text>
  <rect x="464" y="36" width="40" height="100" rx="3" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="484" y="91" font-size="14" fill="#1565c0" text-anchor="middle">40</text>
  <text x="484" y="152" font-size="10" fill="#999" text-anchor="middle">[3]</text>
  <rect x="504" y="36" width="40" height="100" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5"/>
  <text x="524" y="91" font-size="14" fill="#555" text-anchor="middle">50</text>
  <text x="524" y="152" font-size="10" fill="#999" text-anchor="middle">[4]</text>

  <!-- Span -->
  <text x="20" y="54" font-size="14" font-weight="bold" fill="#333">Span&lt;int&gt;</text>
  <rect x="20" y="64" width="44" height="30" rx="3" fill="#fff" stroke="#bbb"/>
  <circle cx="42" cy="79" r="4" fill="#e65100"/>
  <rect x="64" y="64" width="90" height="30" rx="3" fill="#fff" stroke="#bbb"/>
  <text x="109" y="84" font-size="12" fill="#333" text-anchor="middle">Length = 3</text>
  <path d="M 46 79 Q 220 20 386 60" fill="none" stroke="#e65100" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="20" y="112" font-size="11" fill="#999">要素 [1] を直接指す</text>

  <!-- Memory -->
  <text x="20" y="162" font-size="14" font-weight="bold" fill="#333">Memory&lt;int&gt;</text>
  <rect x="20" y="172" width="44" height="30" rx="3" fill="#fff" stroke="#bbb"/>
  <circle cx="42" cy="187" r="4" fill="#1565c0"/>
  <rect x="64" y="172" width="70" height="30" rx="3" fill="#fff" stroke="#bbb"/>
  <text x="99" y="192" font-size="12" fill="#333" text-anchor="middle">開始 = 1</text>
  <rect x="134" y="172" width="90" height="30" rx="3" fill="#fff" stroke="#bbb"/>
  <text x="179" y="192" font-size="12" fill="#333" text-anchor="middle">Length = 3</text>
  <path d="M 42 191 L 42 212 L 250 212 L 312 142" fill="none" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="20" y="238" font-size="11" fill="#999">配列オブジェクトへのふつうの参照と、開始位置を持つ</text>
</svg>
