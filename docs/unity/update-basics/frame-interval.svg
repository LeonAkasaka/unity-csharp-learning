<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 225" width="620" font-family="sans-serif">
  <!-- 凡例 -->
  <circle cx="26" cy="20" r="5" fill="#1565c0"/>
  <text x="36" y="24" font-size="11" fill="#333">Update の呼び出し</text>
  <text x="160" y="24" font-size="11" fill="#e65100">+0.1</text>
  <text x="190" y="24" font-size="11" fill="#333">1 回の移動量（3.0 × deltaTime）</text>
  <text x="390" y="24" font-size="11" fill="#555">0.0333 秒</text>
  <text x="446" y="24" font-size="11" fill="#333">deltaTime（フレームの間隔）</text>

  <!-- 0 秒と 0.1 秒の補助線 -->
  <line x1="100" y1="55" x2="100" y2="195" stroke="#bbb" stroke-dasharray="3 3"/>
  <line x1="500" y1="55" x2="500" y2="195" stroke="#bbb" stroke-dasharray="3 3"/>
  <text x="100" y="212" text-anchor="middle" font-size="11" fill="#555">0 秒</text>
  <text x="500" y="212" text-anchor="middle" font-size="11" fill="#555">0.1 秒</text>

  <!-- 30 fps -->
  <text x="20" y="89" font-size="14" fill="#333">30 fps</text>
  <line x1="100" y1="85" x2="500" y2="85" stroke="#bbb" stroke-width="2"/>
  <g fill="#1565c0">
    <circle cx="233.3" cy="85" r="5"/>
    <circle cx="366.7" cy="85" r="5"/>
    <circle cx="500" cy="85" r="5"/>
  </g>
  <g font-size="11" fill="#e65100" text-anchor="middle">
    <text x="166.7" y="73">+0.1</text>
    <text x="300" y="73">+0.1</text>
    <text x="433.3" y="73">+0.1</text>
  </g>
  <g font-size="10" fill="#555" text-anchor="middle">
    <text x="166.7" y="104">0.0333 秒</text>
    <text x="300" y="104">0.0333 秒</text>
    <text x="433.3" y="104">0.0333 秒</text>
  </g>
  <text x="520" y="82" font-size="11" fill="#555">3 回</text>
  <text x="520" y="98" font-size="13" fill="#e65100">計 0.3</text>

  <!-- 60 fps -->
  <text x="20" y="164" font-size="14" fill="#333">60 fps</text>
  <line x1="100" y1="160" x2="500" y2="160" stroke="#bbb" stroke-width="2"/>
  <g fill="#1565c0">
    <circle cx="166.7" cy="160" r="5"/>
    <circle cx="233.3" cy="160" r="5"/>
    <circle cx="300" cy="160" r="5"/>
    <circle cx="366.7" cy="160" r="5"/>
    <circle cx="433.3" cy="160" r="5"/>
    <circle cx="500" cy="160" r="5"/>
  </g>
  <g font-size="11" fill="#e65100" text-anchor="middle">
    <text x="133.3" y="148">+0.05</text>
    <text x="200" y="148">+0.05</text>
    <text x="266.7" y="148">+0.05</text>
    <text x="333.3" y="148">+0.05</text>
    <text x="400" y="148">+0.05</text>
    <text x="466.7" y="148">+0.05</text>
  </g>
  <g font-size="10" fill="#555" text-anchor="middle">
    <text x="133.3" y="179">0.0167 秒</text>
    <text x="200" y="179">0.0167 秒</text>
    <text x="266.7" y="179">0.0167 秒</text>
    <text x="333.3" y="179">0.0167 秒</text>
    <text x="400" y="179">0.0167 秒</text>
    <text x="466.7" y="179">0.0167 秒</text>
  </g>
  <text x="520" y="157" font-size="11" fill="#555">6 回</text>
  <text x="520" y="173" font-size="13" fill="#e65100">計 0.3</text>
</svg>
