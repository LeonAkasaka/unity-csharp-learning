<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 358" width="640" role="img" aria-labelledby="title">
<title id="title">2秒でX座標0から10へ移動するときの時間・進捗度・座標の対応</title>
<g font-family="sans-serif" font-size="16" fill="#333">
<text x="24" y="32" font-size="20" font-weight="bold">経過時間 → 進捗度 t → X 座標</text><rect x="480" y="56" width="58" height="243" rx="8" fill="#f5f5f5"/><text x="24" y="72" fill="#555">経過時間（秒）</text><line x1="194" y1="94" x2="614" y2="94" stroke="#bbb" stroke-width="2"/><circle cx="194" cy="94" r="5" fill="#1565c0"/><text x="194" y="120" text-anchor="middle" fill="#1565c0" >0</text><circle cx="299" cy="94" r="5" fill="#1565c0"/><text x="299" y="120" text-anchor="middle" fill="#1565c0" >0.5</text><circle cx="404" cy="94" r="5" fill="#1565c0"/><text x="404" y="120" text-anchor="middle" fill="#1565c0" >1</text><circle cx="509" cy="94" r="5" fill="#e65100"/><text x="509" y="120" text-anchor="middle" fill="#e65100" font-weight="bold">1.5</text><circle cx="614" cy="94" r="5" fill="#1565c0"/><text x="614" y="120" text-anchor="middle" fill="#1565c0" >2</text><text x="24" y="162" fill="#555">進捗度 t</text><line x1="194" y1="184" x2="614" y2="184" stroke="#bbb" stroke-width="2"/><circle cx="194" cy="184" r="5" fill="#1565c0"/><text x="194" y="210" text-anchor="middle" fill="#1565c0" >0</text><circle cx="299" cy="184" r="5" fill="#1565c0"/><text x="299" y="210" text-anchor="middle" fill="#1565c0" >0.25</text><circle cx="404" cy="184" r="5" fill="#1565c0"/><text x="404" y="210" text-anchor="middle" fill="#1565c0" >0.5</text><circle cx="509" cy="184" r="5" fill="#e65100"/><text x="509" y="210" text-anchor="middle" fill="#e65100" font-weight="bold">0.75</text><circle cx="614" cy="184" r="5" fill="#1565c0"/><text x="614" y="210" text-anchor="middle" fill="#1565c0" >1</text><text x="24" y="252" fill="#555">X 座標</text><line x1="194" y1="274" x2="614" y2="274" stroke="#bbb" stroke-width="2"/><circle cx="194" cy="274" r="5" fill="#1565c0"/><text x="194" y="300" text-anchor="middle" fill="#1565c0" >0</text><circle cx="299" cy="274" r="5" fill="#1565c0"/><text x="299" y="300" text-anchor="middle" fill="#1565c0" >2.5</text><circle cx="404" cy="274" r="5" fill="#1565c0"/><text x="404" y="300" text-anchor="middle" fill="#1565c0" >5</text><circle cx="509" cy="274" r="5" fill="#e65100"/><text x="509" y="300" text-anchor="middle" fill="#e65100" font-weight="bold">7.5</text><circle cx="614" cy="274" r="5" fill="#1565c0"/><text x="614" y="300" text-anchor="middle" fill="#1565c0" >10</text><text x="24" y="145" fill="#555">÷ 全体の 2 秒</text><text x="24" y="235" fill="#555">× 移動距離 10</text><text x="320" y="336" text-anchor="middle" fill="#e65100">1.5 秒 ÷ 2 秒 = 0.75 → 10 × 0.75 = 7.5</text>
</g>
</svg>
